services:
  backend:
    build: ./BackEnd
    ports:
      - "8000:8000"
    # 컨테이너 DNS 고정 — huggingface.co 등 외부 호스트 이름 해석 실패(Failed to resolve) 방지
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ./BackEnd/.env
    volumes:
      - ./BackEnd/llm:/app/llm
      - ./BackEnd/documents:/app/documents
      - ./BackEnd/app:/app/app
      - ./models:/app/models
      # Vertex 서비스계정 키 — 이미지에 굽지 않고 마운트(:ro). 키 갱신 시 restart만으로 반영
      - ./BackEnd/gcp-sa.json:/app/gcp-sa.json:ro
      # HuggingFace 캐시 영속화 — BGE-M3(~2.3GB)를 최초 1회만 받고 재생성/재빌드해도 재사용.
      # (없으면 컨테이너 재생성마다 쓰기레이어 초기화 → HF 재다운로드로 콜드로딩 20분)
      - ./hf_cache:/root/.cache/huggingface
    environment:
      - RERANKER_MODEL_PATH=/app/models/ko-reranker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build: ./FrontEnd
    ports:
      - "5173:5173"
    volumes:
      - ./FrontEnd/src:/app/src
    depends_on:
      - backend
    restart: unless-stopped
