services:
  backend:
    build: ./BackEnd
    ports:
      - "8000:8000"
    # 컨테이너 DNS 고정 — huggingface.co 등 외부 호스트 이름 해석 실패(Failed to resolve) 방지
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ./BackEnd/.env
    volumes:
      - ./BackEnd/llm:/app/llm
      - ./BackEnd/documents:/app/documents
      - ./BackEnd/app:/app/app
      - ./models:/app/models
      # Vertex 서비스계정 키 — 이미지에 굽지 않고 마운트(:ro). 키 갱신 시 restart만으로 반영
      - ./BackEnd/gcp-sa.json:/app/gcp-sa.json:ro
      # HuggingFace 캐시 영속화 — BGE-M3(~2.3GB)를 최초 1회만 받고 재생성/재빌드해도 재사용.
      # (없으면 컨테이너 재생성마다 쓰기레이어 초기화 → HF 재다운로드로 콜드로딩 20분)
      - ./hf_cache:/root/.cache/huggingface
    environment:
      # 한국어 최적화 리랭커(dragonkue/bge-reranker-v2-m3-ko).
      # 기존 ko-reranker 대비 관련 문서 점수는 올리고 무관 문서는 더 낮춰 변별력이 개선됨
      # (실측: 공결 0.020→0.256, 기숙사비 0.619→0.996, 무관질문 0.128→0.005).
      # 문제 시 /app/models/ko-reranker 로 되돌리면 된다(폴더 보존 중).
      - RERANKER_MODEL_PATH=/app/models/bge-reranker-v2-m3-ko
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build: ./FrontEnd
    ports:
      - "5173:5173"
    volumes:
      - ./FrontEnd/src:/app/src
      # vite.config.js도 마운트 — 프록시/allowedHosts 설정 변경을 재빌드 없이 반영
      - ./FrontEnd/vite.config.js:/app/vite.config.js
    depends_on:
      - backend
    restart: unless-stopped
