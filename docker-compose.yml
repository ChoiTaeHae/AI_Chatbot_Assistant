services:
  backend:
    build: ./BackEnd
    ports:
      - "8000:8000"
    # 컨테이너 DNS 고정 — huggingface.co 등 외부 호스트 이름 해석 실패(Failed to resolve) 방지
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ./BackEnd/.env
    volumes:
      - ./BackEnd/llm:/app/llm
      - ./BackEnd/documents:/app/documents
      - ./BackEnd/app:/app/app
      - ./models:/app/models
    environment:
      - RERANKER_MODEL_PATH=/app/models/ko-reranker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build: ./FrontEnd
    ports:
      - "5173:5173"
    volumes:
      - ./FrontEnd/src:/app/src
    depends_on:
      - backend
    restart: unless-stopped
